# Serve only the built site; scripts, models and state stay out of the published output.
[build]
  publish = "docs"
  command = ""

# Service worker must always be re-fetched so updates reach installed copies.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
